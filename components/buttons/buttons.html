<!-- FILLED -->
<button class="btn btn--pill btn--filled btn-text">
    <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 17.3l-3.6 2.1.7-4.1-3-2.9 4.2-.6L12 8l1.9 3.8 4.2.6-3 2.9.7 4.1z"
            fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </svg>
    <span class="btn__label">Текст на кнопке</span>
  </button>
  
  <!-- OUTLINED -->
  <button class="btn btn--pill btn--outlined btn-text">
    <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 17.3l-3.6 2.1.7-4.1-3-2.9 4.2-.6L12 8l1.9 3.8 4.2.6-3 2.9.7 4.1z"
            fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </svg>
    <span class="btn__label">Текст на кнопке</span>
  </button>
  
  <!-- FILLED WITH BTN (split) -->
  <div class="btn-split btn-split--filled">
    <button class="btn btn--pill btn--filled btn-text btn-split__main">
      <span class="btn__label">Текст на кнопке</span>
    </button>
    <button class="btn btn--icon btn--filled btn-split__addon" aria-label="More">
      <svg class="btn__chev" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  
  <!-- OUTLINED WITH BTN (split) -->
  <div class="btn-split btn-split--outlined">
    <button class="btn btn--pill btn--outlined btn-text btn-split__main">
      <span class="btn__label">Текст на кнопке</span>
    </button>
    <button class="btn btn--icon btn--filled btn-split__addon" aria-label="More">
      <svg class="btn__chev" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  
  <!-- LINK -->
  <button class="btn btn--link btn-text">Текст на кнопке</button>
  
  <!-- ICON ONLY (например, Telegram) -->
  <button class="btn btn--icon btn--filled" aria-label="Telegram">
    <svg class="btn__tg" viewBox="0 0 24 24" aria-hidden="true">

            fill="currentColor"/>
